name: CC-System
version: 1.0.0
author: awabi2048
main: com.awabi2048.ccsystem.CCSystem
api-version: 1.20
description: CrafterCrossingMiscとResourceWorldManagerを統合したプラグイン

commands:
  resource:
    description: 資源ワールド管理コマンド
    usage: /resource <generate|teleport|pause_pregen|close|monitor>
    permission: cc-system.resource.use
  
  delay:
    description: コマンド遅延実行
    usage: /delay <time with s(sec)|t(tick)> <command>
    permission: cc-system.delay.use
  
  npc_message:
    description: NPCメッセージ表示
    usage: /npc_message <message_id> [player]
    permission: cc-system.npc_message.use
  
  cc-system:
    description: CC-System管理コマンド
    usage: /cc-system <toggle|lang|reload|update-day|rental-ticket>
    permission: cc-system.admin
    aliases:
      - ccs

permissions:
  cc-system.*:
    description: CC-Systemの全権限
    default: op
    children:
      cc-system.admin: true
      cc-system.resource.*: true
      cc-system.npc_message.use: true
      cc-system.delay.use: true
  
  cc-system.admin:
    description: CC-System管理権限
    default: op
    children:
      cc-system.toggle: true
      cc-system.lang: true
      cc-system.reload: true
      cc-system.update-day: true
      cc-system.rental-ticket: true
      cc-system.rental.bypass: true
  
  cc-system.toggle:
    description: /ccsystem toggle コマンド使用権限
    default: op
  
  cc-system.lang:
    description: /ccsystem lang コマンド使用権限
    default: true
  
  cc-system.reload:
    description: /ccsystem reload コマンド使用権限
    default: op

  cc-system.update-day:
    description: /ccsystem update-day コマンド使用権限
    default: op

  cc-system.rental-ticket:
    description: /ccsystem rental-ticket コマンド使用権限
    default: op

  cc-system.rental.bypass:
    description: レンタルエリア保護のバイパス権限
    default: op
  
  cc-system.resource.*:
    description: 資源ワールド管理の全権限
    default: op
    children:
      cc-system.resource.use: true
      cc-system.resource.generate: true
      cc-system.resource.teleport: true
      cc-system.resource.pause_pregen: true
      cc-system.resource.close: true
      cc-system.resource.monitor: true

  cc-system.resource.use:
    description: /resource コマンド使用権限
    default: op

  cc-system.resource.generate:
    description: /resource generate 権限
    default: op

  cc-system.resource.teleport:
    description: /resource teleport 権限
    default: true

  cc-system.resource.pause_pregen:
    description: /resource pause_pregen 権限
    default: op

  cc-system.resource.close:
    description: /resource close 権限
    default: op

  cc-system.resource.monitor:
    description: /resource monitor 権限
    default: true

  cc-system.npc_message.use:
    description: /npc_message コマンド使用権限
    default: op
  
  cc-system.delay.use:
    description: /delay コマンド使用権限
    default: op
  
  craftercrossing.test:
    description: テスト用権限（プラグイン内の全権限を付与）
    default: op
    children:
      cc-system.*: true
