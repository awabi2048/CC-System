name: CC-System
version: 2.1.2
author: awabi2048
main: com.awabi2048.ccsystem.CCSystem
api-version: 26.1.2
description: CrafterCrossingMiscとResourceWorldManagerを統合したプラグイン
softdepend:
  - CMI
  - LuckPerms
  - WorldGuard
  - LWC
  - floodgate

commands:
  cc:
    description: Config・アイテム付与・公開メニューの統合管理コマンド
    usage: /cc <config|give|menu>
    permission: cc.command.use
  resource:
    description: 資源ワールド管理コマンド
    usage: /resource <generate|teleport|pause_pregen|close|monitor>
    permission: cc-system.resource.use
  
  delay:
    description: コマンド遅延実行
    usage: /delay <time with s(sec)|t(tick)> <command>
    permission: cc-system.delay.use
  
  npc_message:
    description: NPCメッセージ表示
    usage: /npc_message <message_id> [player]
    permission: cc-system.npc_message.use
  
  cc-system:
    description: CC-System管理コマンド
    usage: /cc-system <toggle|reload|update-day|rental-ticket|status|enable|disable>
    aliases:
      - ccs
  
  rental-receive:
    description: 期限切れレンタルエリアの回収アイテムを受け取る
    usage: /rental-receive [area_id]
    permission: cc-system.rental.receive

  announcement:
    description: サーバーお知らせメニューを開く
    usage: /announcement [-menu]
    aliases:
      - an
    permission: cc-system.announce.use

  clock:
    description: タイマー・アラームを設定する
    usage: /clock <timer|alarm|list|cancel>
    permission: cc-system.clock.set

permissions:
  cc.command.use:
    description: /ccコマンドの基本利用権限
    default: op
  cc.command.*:
    description: /cc統合管理コマンドの全権限
    default: op
    children:
      cc.command.use: true
      cc.command.config: true
      cc.command.give: true
      cc.command.give.all: true
      cc.command.menu: true
      cc.item.give.cc-content: true
      cc.item.give.myworld: true
      cc.item.give.kantan: true
  cc.command.config:
    description: Config状態確認・移行・再読込権限
    default: op
  cc.command.give:
    description: 登録アイテム付与権限
    default: op
  cc.command.give.all:
    description: 全オンラインプレイヤーへの登録アイテム付与権限
    default: op
  cc.command.menu:
    description: 公開メニュー起動権限
    default: op
  cc.item.give.cc-content:
    description: CC-Content登録アイテム付与権限
    default: op
  cc.item.give.myworld:
    description: MyWorld登録アイテム付与権限
    default: op
  cc.item.give.kantan:
    description: Kantan Commanderディスク付与権限
    default: op
  cc-system.*:
    description: CC-Systemの全権限
    default: op
    children:
      cc-system.admin: true
      cc-system.resource.*: true
      cc-system.announce.*: true
      cc-system.npc_message.use: true
      cc-system.delay.use: true
      cc-system.clock.set: true
  
  cc-system.admin:
    description: CC-System管理権限
    default: op
    children:
      cc-system.toggle: true
      cc-system.reload: true
      cc-system.update-day: true
      cc-system.rental-ticket: true
      cc-system.status: true
      cc-system.enable: true
      cc-system.disable: true
      cc-system.lwc.expansion: true
      cc-system.rental.bypass: true
      cc-system.announce.use: true
      cc-system.announce.manage: true
      cc-system.clock.set: true
  
  cc-system.toggle:
    description: /ccsystem toggle コマンド使用権限
    default: op
  
  cc-system.reload:
    description: /ccsystem reload コマンド使用権限
    default: op

  cc-system.update-day:
    description: /ccsystem update-day コマンド使用権限
    default: op

  cc-system.rental-ticket:
    description: /ccsystem rental-ticket コマンド使用権限
    default: op

  cc-system.status:
    description: /ccsystem status コマンド使用権限
    default: op

  cc-system.enable:
    description: /ccsystem enable コマンド使用権限
    default: op

  cc-system.disable:
    description: /ccsystem disable コマンド使用権限
    default: op

  cc-system.lwc.expansion:
    description: LWC保護情報の集計・削除権限
    default: op

  cc-system.rental.bypass:
    description: レンタルエリア保護のバイパス権限
    default: op

  cc-system.rental.receive:
    description: 期限切れレンタルエリアの回収アイテムを受け取る権限
    default: true
  
  cc-system.resource.*:
    description: 資源ワールド管理の全権限
    default: op
    children:
      cc-system.resource.use: true
      cc-system.resource.generate: true
      cc-system.resource.teleport: true
      cc-system.resource.pause_pregen: true
      cc-system.resource.close: true
      cc-system.resource.monitor: true

  cc-system.resource.use:
    description: /resource コマンド使用権限
    default: op

  cc-system.resource.generate:
    description: /resource generate 権限
    default: op

  cc-system.resource.teleport:
    description: /resource teleport 権限
    default: true

  cc-system.resource.pause_pregen:
    description: /resource pause_pregen 権限
    default: op

  cc-system.resource.close:
    description: /resource close 権限
    default: op

  cc-system.resource.monitor:
    description: /resource monitor 権限
    default: true

  cc-system.npc_message.use:
    description: /npc_message コマンド使用権限
    default: op
  
  cc-system.delay.use:
    description: /delay コマンド使用権限
    default: op

  cc-system.announce.*:
    description: お知らせ機能の全権限
    default: op
    children:
      cc-system.announce.use: true
      cc-system.announce.manage: true

  cc-system.announce.use:
    description: /announcement コマンド使用権限
    default: true

  cc-system.announce.manage:
    description: お知らせ管理権限（追加・編集・削除・詳細表示）
    default: op
    children:
      cc-system.announce.use: true

  cc-system.clock.set:
    description: /clock コマンド使用権限
    default: op
  
  craftercrossing.test:
    description: テスト用権限（プラグイン内の全権限を付与）
    default: op
    children:
      cc-system.*: true
