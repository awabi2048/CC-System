content_management:
  no_permission: '&c権限がありません'
  usage: '&e使用法: /ccc <status|enable|disable> [feature]'
  status_header: '&6=== CC-Content コンテンツ状態 ==='
  status_line: '&7- &f{feature}: {status}'
  state:
    enabled: '&a有効'
    disabled: '&c無効'
    warning: '&e有効（警告あり）'
    failure: '&c有効（初期化失敗）'
  feature:
    arena: アリーナ
    rank: 職業・ランク
    brewery: 醸造
    cooking: 料理
    fishing: 釣り
    resource_collection: 資源収集
    seasonal: 季節イベント
    sukima_dungeon: スキマダンジョン
    party: パーティー
    minigame: ミニゲーム
  unknown_feature: '&c不明なコンテンツです: {feature}'
  feature_unavailable: '&c{feature}は現在利用できません。/ccc status で状態を確認してください'
  already_set: '&e{feature} は既に{status}です'
  enable_dependency_required: '&c{feature}を有効化する前に、次のコンテンツを有効化してください: {dependencies}'
  enable_dependency_unavailable: '&c{feature}を有効化できません。次の依存コンテンツの初期化状態を解消してください: {dependencies}'
  disable_dependent_required: '&c{feature}を無効化する前に、次のコンテンツを無効化してください: {dependents}'
  change_started: '&6{feature}を{status}に変更し、CC-Contentを再初期化します...'
  change_success: '&a{feature}を{status}に変更しました'
  save_failed: '&cコンテンツ設定の保存に失敗しました: {reason}'
  debug:
    usage: '&e使用法: /ccc debug <clear_block_placement_data|placement_recording|clear_fishing_grounds|complete_oage_daily> ...'
    unknown_mode: '&c不明なデバッグ項目です: {mode}'
    placement_recording:
      usage: '&e使用法: /ccc debug placement_recording <enable|disable|status>'
      unavailable: '&cブロック配置記録の制御機能が利用できません'
      status: '&7ブロック配置記録: {status}'
      changed: '&aブロック配置記録を{status}にしました'
      state:
        enabled: '&a有効'
        disabled: '&c無効'
    fishing_ground:
      usage: '&e使用法: /ccc debug clear_fishing_grounds'
      unavailable: '&c天然の好漁場を管理する機能が利用できません'
      cleared: '&a現在の天然の好漁場をすべて削除しました'
