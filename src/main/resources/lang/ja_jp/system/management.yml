management:
  usage: "§e使用法: /cc <config|debug|give|menu|particle>"
  no_permission: "§cこの操作を実行する権限がありません。"
  player_not_found: "§c対象プレイヤーが見つかりません: {player}"
  config:
    usage: "§e使用法: /cc config <status|check|migrate|reload> [plugin]"
    none: "§e登録済みのConfigがありません。"
    line: "{color}[{owner}] {file} {detected}->{required} {state} {message}"
  give:
    usage: "§e使用法: /cc give <target> <item-id> [amount] [引数...]"
    success: "§a{player}へ{item}を付与しました。付与: {granted}、ドロップ: {dropped}"
    failed: "§c{player}への{item}付与に失敗しました: {reason}"
  menu:
    usage: "§e使用法: /cc menu <owner:id> [target] [key=value...]"
    unknown: "§c公開メニューが見つかりません: {menu}"
    target_required: "§c対象プレイヤーを指定してください。"
    self_only: "§cこのメニューは実行者本人にだけ開けます。"
    invalid_argument: "§cメニュー引数が不正です: {argument}"
    success: "§a{player}へ{menu}を開きました。"
    failed: "§c{player}へ{menu}を開けませんでした。"
  particle:
    usage: "§e使用法: /cc particle limit [global|owner|per-tick|emission] [set <値>]"
    type:
      global: "サーバー全体の同時存在数"
      owner: "所有プラグインごとの同時存在数"
      per-tick: "所有プラグインごとの1 tick生成数"
      emission: "1回の放出数"
    status_header: "§eDisplayパーティクル制限（現在使用中: {used}）"
    status_line: "§7- {type}: §f{limit} §8（設定範囲: {minimum}～{maximum}）"
    invalid_limit: "§c{type}は{minimum}～{maximum}の整数で指定してください。"
    save_failed: "§cDisplayパーティクル制限を保存できませんでした。"
    changed: "§aDisplayパーティクル制限 {type} を{limit}に変更しました。"
  debug:
    usage: "§e使用法: /cc debug toggle_test（プレイヤーのみ）"
    particle_test_enabled: "§a本と羽ペンによるボクセルパーティクルテストを有効にしました。JSONを記述した本をメインハンドに持って左クリックしてください。"
    particle_test_disabled: "§e本と羽ペンによるボクセルパーティクルテストを無効にしました。"
    particle_test_empty_book: "§c本と羽ペンにJSONを記述してください。"
    particle_test_started: "§a本のJSONからボクセルパーティクルを表示しました。"
    particle_test_rejected: "§cボクセルパーティクルを表示できませんでした: {detail}"
    particle_test_invalid_json: "§c本のJSONが不正です: {detail}"
