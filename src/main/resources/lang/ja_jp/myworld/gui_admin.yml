  admin_menu:
    title: 管理者メニュー
    target_world_label: 対象ワールド
    update_data:
      display: §eデータ更新
      lore:
      - §7全ワールド・プレイヤーデータの整合性を確認し、
      - §7修復・更新を行います。
      action: 確認を開く
      confirm_title: データ更新の確認
    repair_templates:
      display: §eテンプレート修復
      lore:
      - §7欠損しているテンプレートワールドを検出し、
      - §7再生成を試みます。
      action: 確認を開く
      confirm_title: テンプレート修復の確認
    create_template:
      display: §aテンプレート作成
      lore:
      - §7テンプレート作成ウィザードを開きます。
      action: テンプレート作成を開始
    archive:
      display: §cアーカイブ実行
      lore:
      - §7期限切れのワールドを一括アーカイブします。
      action: 確認を開く
      confirm_title: 一括アーカイブの確認
    convert:
      display: §6ワールド変換
      lore:
      - §7現在のワールドをMyWorld管理下に登録します。
      - §7(ディレクトリをリネームして標準管理)
      - §7(現在の構成を維持して管理のみ適用)
      action:
        normal: Normalモードで変換
        admin: Adminモードで変換
      confirm_normal: 変換確認 (Normal)
      confirm_admin: 変換確認 (Admin)
    unlink:
      display: §c紐づけ解除
      lore:
      - §7現在のワールドのマイワールド設定を削除し、
      - §7通常のワールドに戻します。
      - §7(ワールドデータ自体は削除されません)
      action: 確認を開く
      confirm_title: 紐づけ解除の確認
    export:
      display: §bワールドのエクスポート
      unavailable_warning: 現在のワールドはマイワールドではないため、エクスポートできません。
      lore:
      - §7現在のワールドをZIP形式でエクスポートします。
      action: 確認を開く
      confirm_title: エクスポート確認
    plugin_info:
      display: §bMyWorldManager
      lore:
      - §7Version: {version}
      - §7Author: {author}
    menu_switch:
      display: §b管理メニュー
      lore:
      - §7{next}へ切り替えます。
      action: 管理メニューを切り替え
    archive_world:
      confirm_title: アーカイブの確認
    unarchive_world:
      confirm_title: アーカイブ解除の確認
    info:
      display: §aワールド一覧
      lore:
      - §7全ワールドの一覧を表示・管理します。
      action: ワールド一覧を開く
    current_world:
      display: §b現在のワールド情報
    portals:
      display: §bポータル管理
      lore:
      - §7設置済みポータルの一覧を表示します。
      action: ポータル管理を開く
  unarchive_confirm:
    title: §6アーカイブ解除の確認
    description:
    - §fこのワールドは現在アーカイブされています。
    - §f解除してワープしますか？
    action: 解除してワープ
  archive_confirm:
    title: §6アーカイブの確認
