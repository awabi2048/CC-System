      expires_at: アーカイブまで
      expires_value: '{days}日（{date} にアーカイブ）'
    creation_button:
      display: §a§lマイワールドを新規作成
      action: ワールド作成を開始
      description:
      - §7新しいマイワールドを作成します。
      - §7テンプレートや公開範囲を自由に設定可能です。
    creation_unavailable:
      policy_denied:
        display: §c現在はワールドを作成できません
        lore:
        - §7ワールド作成は現在利用できません。
        - §7利用できるようになるまでお待ちください。
      no_slot:
        display: §cワールドスロットに空きがありません
        lore:
        - §7マイワールドの作成枠がすべて使用中です。
        - §7不要になったワールドを削除するか、「ワールドの種」で枠を追加してください。
      no_permission:
        display: §cワールドを作成する権限がありません
        lore:
        - §7ワールドを作成する権限がありません。
        - §7作成権限が必要です。
    stats_button:
      display: §e{player}
      points_label: ワールドポイント
      points_description: マイワールドの新規作成や拡張に使えるポイントです
      slots_label: ワールドスロット
      world_count_label: ワールド数
      slots_description: 新規にマイワールドを作成できる枠数です。「ワールドの種」で追加できます
      slots_bypass_description: 上限を貫通する権限が付与されています
    pending_button:
      display: 招待・申請
      description:
      - 受信した招待と申請を確認します。
      count_label: 保留中の件数
      latest_label: 直近の通知
      none: なし
      empty: "§7保留中の招待・申請はありません"
      action: 一覧を開く
