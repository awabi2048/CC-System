gui:
  settings:
    title: ワールド設定({world})
    common:
      must_be_in_world: §cこの設定を変更するにはワールド内にいる必要があります
    click:
      left: 左クリック
      right: 右クリック
    info:
      display: §aワールド情報の設定
      blocks:
        summary:
        - §7クリック後、ダイアログでまとめて編集します
      action:
        open_editor: ワールド情報を編集
      dialog:
        body: ワールド名と説明文をまとめて編集できます。ワールド名が空欄なら変更なし、説明文が空欄なら説明なしになります。
    spawn:
      display: §aスポーン地点の設定
      type:
        guest: ゲスト用
        member: メンバー用
        both: ゲスト/メンバー共通
      blocks:
        description:
        - §7クリック後、設定したい地点のブロックを
        - §7クリックして決定します。
        - §e※設定時のプレイヤーの向きが保存されます
      action:
        set_guest: ゲスト用スポーン地点を設定
        set_member: メンバー用スポーン地点を設定
        set_both: ゲスト/メンバー共通スポーン地点を設定
        select_type: 設定するスポーン地点の種類を選択
      form:
        content: 設定するスポーン地点の種類を選択してください。
    error:
      must_be_in_world_lore: §c※この設定を変更するにはワールド内にいる必要があります
    icon:
      display: §aワールドアイコンの変更
      blocks:
        description:
        - §7クリックした後、インベントリ内のアイテムを
        - §7クリックしてアイコンを設定します
      action:
        start_selection: アイコンを設定
    tags:
      display: §aワールドタグの設定
      lore_empty: '  §fなし'
      lore_item: '{tag}'
      blocks:
        description:
        - §7ディスカバリー検索で使われる
        - §7ワールドタグを設定します。
        current_label: 設定中のタグ
      action:
        edit: タグを編集
    expand:
      display: §6ワールドの拡張
      blocks:
        description:
        - §7ワールドのボーダーを拡張し、
        - §7建築可能範囲を広げます。
        current_level: 現在の拡張レベル
        next_level: 次の拡張レベル
        cost: 必要ポイント
        owned_points: 所有ポイント
        shortage: '{shortage}ポイント不足しています'
        max_reached: これ以上拡張できません
        no_border: このワールドにボーダーはありません
        border_center: 現在のボーダー中心
        border_size: 現在のボーダーサイズ
      action:
        open_menu: メニューを開く
        teleport_center: ボーダー中心の地表へテレポート
    environment:
      display: §aワールド環境の設定
      blocks:
        summary:
        - §7ワールドのバイオーム、天気、重力を
        - §7変更することができます。
      action:
        open: 表示
    publish:
      display: §6公開レベルの変更
      current_label: 現在の設定
      active_prefix: '§6» '
      inactive_prefix: '  '
      action:
        previous: 前のページへ移動
        next: 次のページへ移動
    member:
      display: §6メンバーの管理
      role_owner: オーナー
      role_moderator: モデレーター
      role_member: メンバー
      list_item: '  {debug_color}[{role_color}{role}{debug_color}] {name_color}{player}'
      list_item_member: '  {name_color}{player}'
      more_members: '  §7+{remaining}人 (§a{online}人オンライン§7)'
      blocks:
        description:
        - §7このワールドに参加できる
        - §7プレイヤーを管理します。
        count: 現在のメンバー数
        pending_requests: 参加申請中
        pending_invites: メンバー招待中
        list_header: メンバーの一覧
      action:
        open_list: 一覧を表示
    main_info:
      name: §f【§a{world}§f】
      owner_label: オーナー
      expansion_label: 拡張レベル
      created_label: 作成日
      archive_label: 自動アーカイブまで
      archive_value: '{days}日（{date}）'
      members_label: メンバー
      members_value: '{members}人（オンライン: {online}人）'
      publish_label: 公開レベル
      favorites_label: お気に入り数
      visitors_label: 最近訪れたプレイヤー
    visitors:
      display: §a訪問中のプレイヤー一覧
      blocks:
        count_label: 現在ワールドを訪れているプレイヤー
      action:
        open: 一覧を表示
    notification:
      display: §a訪問通知の切り替え
      'on': オン
      'off': オフ
      blocks:
        current_label: 通知の設定
        description:
        - オンの場合、メンバー以外の訪問者が
        - 来た際にメンバー全員に通知します
        - 個人設定からオフにすることもできます
      action:
        toggle: 切り替え
    announcement:
      display: §aプレイヤー案内の設定
      preview_header: 現在の案内メッセージ
      blocks:
        description:
        - §7訪問者に向けて表示する
        - §7案内メッセージを設定します。
      action:
        set_message: メッセージを設定
        reset_message: 設定をリセット
        open_menu: 操作メニューを開く
    critical:
      display: §c§n重大な設定
      blocks:
        summary:
        - §cワールドの削除や、拡張の初期化など
        - §c取り返しのつかない操作を行います。
      action:
        open: 表示
    portals:
      display: §b設置済みポータルの管理
      blocks:
        summary:
        - §7ワールド内に設置されているポータルを
        - §7一括で管理・確認します。
      action:
        open: 表示
  user_settings:
    title: 個人設定
    cycle_action:
      next: 次の項目へ変更
      previous: 前の項目へ変更
      toggle: 切り替え
    notification:
      display: §a訪問者の通知
      blocks:
        description:
        - 誰かがあなたのワールドを訪れたときに
        - 通知を送信するかどうかを設定します。
        current_label: 現在の状態
    language:
      display: §a言語設定
      format: §f{language}
      blocks:
        description:
        - メニューやメッセージの表示言語を変更します。
        current_label: 現在の設定
    critical_settings_visibility:
      display: §a重大な設定の表示
      blocks:
        description:
        - ワールド管理メニュー内の
        - 「重大な設定」アイコンを表示するか設定します。
        current_label: 現在の設定
    tour_navigation:
      display: §bワールドツアーのナビゲーション
      blocks:
        description:
        - ワールドツアー中のナビ表示方法を切り替えます。
        - メッセージは常に表示されます。
      mode:
        bossbar_only: ボスバーのみ
        all: すべて
        none: なし
    button:
      display: §6個人設定
      action: 個人設定を開く
  environment:
    title: 環境設定
    gravity:
      display: §e重力の設定
      current: 現在の倍率
      requirement: 月の石を持っている必要があります
      action: 重力を変更
      cost: 必要ポイント
      options:
        zero: 無重力 (x0.0)
        moon: 月 (x0.17)
        mars: 火星 (x0.38)
        earth: 地球 (x1.0)
    weather:
      display: §b天候の設定
      current: 現在の天候
      cost: 必要ポイント
      desc: §7設定した天候で固定されます。
      action:
        cycle: 天候を切り替え
        confirm: 確定してポイントを消費
    biome:
      display: §aバイオームの設定
      current: 現在のバイオーム
      requirement: バイオームの瓶を持っている必要があります
      action: バイオームを変更
      click_bottle_hint: §7バイオーム入りの瓶を持ってクリックしてください
      cost: 必要ポイント
      desc: §7ワールド全体のバイオームを変更します。
  member_management:
    title: ワールドメンバーの管理
    invite:
      name: §aメンバーを招待
      desc: §7クリックした後、名前を入力して招待します
      action:
        normal: 招待
        force: 強制追加
    admin_owner_reset:
      name: §cオーナーを再設定
      current_owner: 現在のオーナー
      action: 新しいオーナーを指定
      dialog:
        title: オーナーを再設定
        body: "ワールド「{world}」の現在のオーナーは {owner} です。新しいオーナーのプレイヤー名を入力してください。"
        input: 新しいオーナー
        confirm: §c再設定
        cancel: §aキャンセル
      error:
        empty: §cプレイヤー名を入力してください。
        not_found: §cプレイヤー「{player}」が見つかりません。
        same_owner: §cそのプレイヤーは既にオーナーです。
      success: §aオーナーを {player} に再設定しました。
    remove_confirm:
      title: 確認
      question: 本当に削除しますか？
      player_label: プレイヤー
      world_label: ワールド
      access_warning: メンバーから削除すると、このワールドへのアクセス権限が失われます
      cancel: §aキャンセル
      cancel_desc: §7メンバー一覧に戻る
      confirm: §c削除する
      confirm_desc: §7このプレイヤーをワールドメンバーから削除します
    item:
      last_online_label: 最終オンライン
      online_label: §aオンライン
      role_label: 権限
      action:
        change_role: 権限を{next_role}に変更
        transfer_owner: オーナー権限を譲渡
        remove_member: ワールドメンバーから削除
    pending_item:
      name: §e{player} §7(招待中)
      status_online: §e招待中 §7(§aオンライン§7)
      status_offline: §e招待中 §7(§cオフライン§7)
      click: §7招待を取り消す
    pending_cancel_confirm:
      title: 招待のキャンセル確認
      body: §c{player}さんへのメンバー招待を取り消しますか？
      cancel: §a戻る
      confirm: §c実行
    transfer_confirm:
      title: オーナー権限の譲渡
      question: 本当にオーナー権限を譲渡しますか？
      player_label: 新しいオーナー
      world_label: 対象ワールド
      owner_warning: 譲渡すると、あなたはこのワールドのオーナーではなくなります
      cancel: §aキャンセル
      cancel_desc: §7メンバー一覧に戻る
      confirm: §c譲渡する
      confirm_desc: §dこのプレイヤーにオーナー権限を譲渡します
  visitor_management:
    title: 訪問中のプレイヤー
    no_visitors: §7現在、このワールドに訪問者はいません。
    kick_confirm:
      title: 確認
      question: §c本当にキックしますか？
      player_label: プレイヤー
      cancel: §aキャンセル
      cancel_desc: §7一覧に戻る
      confirm: §cキックする
      confirm_desc: §7このプレイヤーをワールドから追い出します
    item:
      kick: キック
