management:
  usage: "§eUsage: /cc <config|debug|give|menu|particle>"
  no_permission: "§cYou do not have permission to perform this action."
  player_not_found: "§cTarget player was not found: {player}"
  config:
    usage: "§eUsage: /cc config <status|check|migrate|reload> [plugin]"
    none: "§eNo managed configs are registered."
    line: "{color}[{owner}] {file} {detected}->{required} {state} {message}"
  give:
    usage: "§eUsage: /cc give <target> <item-id> [amount] [arguments...]"
    success: "§aGranted {item} to {player}. Granted: {granted}, dropped: {dropped}"
    failed: "§cFailed to grant {item} to {player}: {reason}"
  menu:
    usage: "§eUsage: /cc menu <owner:id> [target] [key=value...]"
    unknown: "§cPublic menu was not found: {menu}"
    target_required: "§cSpecify a target player."
    self_only: "§cThis menu can only be opened for the executor."
    invalid_argument: "§cInvalid menu argument: {argument}"
    success: "§aOpened {menu} for {player}."
    failed: "§cCould not open {menu} for {player}."
  particle:
    usage: "§eUsage: /cc particle limit [global|owner|per-tick|emission] [set <value>]"
    type:
      global: "server-wide active count"
      owner: "active count per owning plugin"
      per-tick: "spawn count per owning plugin per tick"
      emission: "count per emission"
    status_header: "§eDisplay particle limits ({used} currently active)"
    status_line: "§7- {type}: §f{limit} §8(range: {minimum}–{maximum})"
    invalid_limit: "§cSpecify {type} as an integer from {minimum} to {maximum}."
    save_failed: "§cCould not save the Display particle limit."
    changed: "§aChanged Display particle limit {type} to {limit}."
  debug:
    usage: "§eUsage: /cc debug toggle_particle_test (players only)"
    particle_test_enabled: "§aEnabled book-based voxel particle testing. Put one field on each page, close the editor, then left-click."
    particle_test_disabled: "§eDisabled book-based voxel particle testing."
    particle_test_empty_book: "§cWrite JSON in the writable book first."
    particle_test_rejected: "§cCould not display voxel particles: {detail}"
    particle_test_invalid_json: "§cThe book JSON is invalid: {detail}"
    particle_test_cached: "§aValidated the book JSON and cached the particle settings."
    particle_test_not_cached: "§cThis book is not cached. Open it and close the editor first."
    particle_test_choice:
      header: "§eAllowed strings for {field} (hover for a description):"
      block: "A vanilla block used as the BlockDisplay voxel appearance."
      motion:
        static: "Remains stationary."
        inertial: "Keeps its initial velocity while gradually slowing down."
        ballistic: "Accelerates downward in a ballistic arc."
        buoyant: "Rises with turbulence."
        drift: "Drifts irregularly."
        burst: "Bursts radially from the center."
        orbit: "Orbits around the center."
        attract: "Moves inward toward the center."
      collision:
        none: "Does not process block collisions."
        remove: "Disappears on collision."
        stop: "Stops at the collision point."
        slide: "Slides along the collision surface."
        bounce: "Reflects from the collision surface."
      visibility:
        normal: "Displays only within the normal tracking range."
        force: "Spawns regardless of whether target players are present."
    particle_test_guide:
      open_hover: "§7Click to show descriptions for all configurable fields."
      header: "§6Voxel Particle Settings Guide §e{genre} §7({page}/{total})"
      previous: "§8[§ePrevious category§8]"
      next: "§8[§eNext category§8]"
      navigation_hover: "§7Show the {genre} settings."
      field:
        textures_entry_block: "§7Vanilla block ID used for the voxel, for example minecraft:orange_concrete."
        textures_entry_weight: "§7Relative selection weight within textures; use an integer of 1 or greater."
        scale_initial: "§7Size at spawn; accepts a number or [x,y,z]."
        scale_peak: "§7Maximum size reached after spawning."
        scale_peak_progress: "§7Lifetime progress at peak size, from 0 to 1."
        scale_scale_in_ticks: "§7Ticks used for the spawn scale interpolation."
        scale_variation: "§7Per-particle size variation from 0 to 0.9."
        rotation_random_initial: "§7When true, randomizes each particle's initial orientation."
        rotation_angular_velocity: "§7Rotation per tick as [x,y,z]."
        rotation_variation: "§7Per-particle angular velocity variation from 0 to 1."
        lifetime_ticks: "§7Base lifetime in ticks."
        lifetime_variation: "§7Maximum per-particle lifetime variation in ticks."
        lifetime_fade_out_ticks: "§7Ticks used to interpolate scale to zero when disappearing."
        lifetime_fade_variation: "§7Per-particle variation added to fade duration."
        lifetime_spawn_delay: "§7Maximum per-particle spawn delay in ticks."
        motion_preset: "§7Base motion preset. Invalid input displays the available values."
        motion_initial_velocity: "§7Overrides initial velocity as [x,y,z]."
        motion_acceleration: "§7Overrides acceleration per tick as [x,y,z]."
        motion_retention: "§7Velocity retained each tick, from 0 to 1."
        motion_turbulence: "§7Strength of irregular positional turbulence."
        motion_frequency: "§7Frequency at which turbulence changes."
        motion_radial_speed: "§7Outward speed from the center for burst."
        motion_spawn_radius: "§7Initial placement radius for orbit and attract."
        motion_orbit_speed: "§7Orbital angular velocity per tick for orbit."
        motion_radial_pull: "§7Strength used to return orbit particles to the reference radius."
        motion_attraction: "§7Strength pulling attract particles toward the center."
        motion_max_speed: "§7Maximum movement speed for attract."
        collision_mode: "§7Behavior on block collision. Invalid input displays available values."
        collision_restitution: "§7Bounce restitution from 0 to 1."
        emission_offset: "§7Additional position offset from the gaze-based display origin."
        emission_delta: "§7Random initial-position range on each axis."
        emission_speed: "§7Random initial speed applied along delta."
        emission_count: "§7Number of voxels spawned at once, from 1 to 32."
        emission_visibility: "§7Visibility behavior. Invalid input displays available values."
    particle_test_fix:
      added: "§aAutomatically added missing settings: {fields}"
      requires_removal: "§eA correction that removes content is required: {fields}"
      apply: "§8[§6Automatically fix book§8]"
      apply_hover: "§7Click to remove unsupported content from the held book and normalize it."
      applied: "§aAutomatically fixed the book and cached the particle settings."
      expired: "§cThe held book differs from the target, or the correction link has expired."
    particle_sample_item:
      name: "§6Voxel Particle Sample"
      description: "§7An editable sample with appearance and motion settings split across pages."
      operation: "§eOpen and close the book to cache its settings"
