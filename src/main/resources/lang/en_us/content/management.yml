content_management:
  no_permission: '&cYou do not have permission.'
  usage: '&eUsage: /ccc <status|enable|disable> [feature]'
  status_header: '&6=== CC-Content Status ==='
  status_line: '&7- &f{feature}: {status}'
  state:
    enabled: '&aEnabled'
    disabled: '&cDisabled'
    warning: '&eEnabled (warning)'
    failure: '&cEnabled (initialization failed)'
  feature:
    arena: Arena
    rank: Profession and Rank
    brewery: Brewery
    cooking: Cooking
    fishing: Fishing
    resource_collection: Resource Collection
    seasonal: Seasonal Events
    sukima_dungeon: Sukima Dungeon
    party: Party
    minigame: Minigame
  unknown_feature: '&cUnknown content: {feature}'
  feature_unavailable: '&c{feature} is currently unavailable. Check /ccc status.'
  already_set: '&e{feature} is already {status}.'
  enable_dependency_required: '&cEnable these contents before enabling {feature}: {dependencies}'
  enable_dependency_unavailable: '&cCannot enable {feature}. Resolve the initialization state of: {dependencies}'
  disable_dependent_required: '&cDisable these contents before disabling {feature}: {dependents}'
  change_started: '&6Changing {feature} to {status} and reinitializing CC-Content...'
  change_success: '&aChanged {feature} to {status}.'
  save_failed: '&cFailed to save the content setting: {reason}'
  debug:
    usage: '&eUsage: /ccc debug <clear_block_placement_data|placement_recording|clear_fishing_grounds|complete_oage_daily> ...'
    unknown_mode: '&cUnknown debug mode: {mode}'
    placement_recording:
      usage: '&eUsage: /ccc debug placement_recording <enable|disable|status>'
      unavailable: '&cBlock placement recording control is unavailable.'
      status: '&7Block placement recording: {status}'
      changed: '&aBlock placement recording is now {status}.'
      state:
        enabled: '&aenabled'
        disabled: '&cdisabled'
    fishing_ground:
      usage: '&eUsage: /ccc debug clear_fishing_grounds'
      unavailable: '&cNatural fishing ground management is unavailable.'
      cleared: '&aRemoved all current natural fishing grounds.'
  particle:
    no_permission: '&cYou do not have permission to display Display particles.'
    usage: '&eUsage: /ccc particle <appearance> <motion> <collision> [<x> <y> <z>] [<dx> <dy> <dz> <speed> <count> [normal|force]] [-- <property=value>...]'
    invalid_argument: '&cInvalid particle argument: {detail}'
    unknown_pattern: '&cUnknown Display particle preset: {pattern}'
    no_viewers: '&eSkipped creation because no player is in view range. Specify force if needed.'
    started: '&aDisplayed Display particles: {pattern} x{count}'
    rejected: '&cCould not display Display particles: {detail}'
