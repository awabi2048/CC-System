chanpon:
  environment:
    title: "Environment Settings"
    common:
      back: "Back"
      back_to_settings: "Back to World Settings"
      not_set: "Not set"
      current_label: "Current"
      action_next: "Click to toggle"
      action_prev: "Click to toggle"
      action_custom_time: "Click to toggle"
      must_be_in_world_warning: "You must be in this world to change this setting!"
    weather:
      description: "Choose fixed weather, or return to normal weather changes."
      title: "Weather Settings"
      display: "Weather"
      lore:
        - "Current: {current}"
        - "Left-click: next"
        - "Right-click: previous"
      clear:
        display: "Clear"
        lore:
          - "{marker} Clear"
          - "Click to set"
      rain:
        display: "Rain"
        lore:
          - "{marker} Rain"
          - "Click to set"
      thunder:
        display: "Thunderstorm"
        lore:
          - "{marker} Thunderstorm"
          - "Click to set"
    time:
      description: "Choose fixed time, or return to normal time progression."
      title: "Time Settings"
      display: "Time"
      lore:
        - "Current: {current}"
        - "Left-click: next"
        - "Right-click: previous"
        - "Shift-left-click: custom time"
      custom:
        display: "Custom ({time})"
        title: "Custom Time"
        body: "Enter a tick value from 0 to 23999, or HH:mm."
        label: "Time"
        apply: "Apply"
        invalid: "Enter 0-23999 or HH:mm."
      morning:
        display: "Morning"
        lore:
          - "{marker} Morning (time=0)"
          - "Click to set"
      noon:
        display: "Noon"
        lore:
          - "{marker} Noon (time=6000)"
          - "Click to set"
      dusk:
        display: "Dusk"
        lore:
          - "{marker} Dusk (time=12500)"
          - "Click to set"
      night:
        display: "Night"
        lore:
          - "{marker} Night (time=18000)"
          - "Click to set"
    gravity:
      description: "Sets the gravity applied to entities inside this world."
      title: "Gravity Settings"
      display: "Gravity"
      lore:
        - "Current: {current}"
        - "Left-click: next"
        - "Right-click: previous"
      earth:
        display: "Earth"
        lore:
          - "{marker} Earth (gravity=0.08)"
          - "Click to set"
      mars:
        display: "Mars"
        lore:
          - "{marker} Mars (gravity=0.02)"
          - "Click to set"
      moon:
        display: "Moon"
        lore:
          - "{marker} Moon (gravity=0.01)"
          - "Click to set"
    scale:
      description: "Sets the player size used inside this world."
      title: "Player Size Settings"
      display: "Size"
      lore:
        - "Current: {current}"
        - "Left-click: next"
        - "Right-click: previous"
      normal:
        display: "Normal"
        lore:
          - "{marker} Normal (scale=1.0)"
          - "Click to set"
      small:
        display: "Small"
        lore:
          - "{marker} Small (scale=0.5)"
          - "Click to set"
      giant:
        display: "Giant"
        lore:
          - "{marker} Giant (scale=2.0)"
          - "Click to set"
    flight:
      description: "Allows flight for game modes other than Creative."
      display: "Allow Flight"
      enabled: "Allowed"
      disabled: "Not allowed"
      lore:
        - "Current: {current}"
        - "Click to toggle"
      notification:
        enabled: "§aFlight is allowed in this world."
        disabled: "§cFlight is not allowed in this world."
        restored_default: "§7You left the world, so your flight setting has been restored."
