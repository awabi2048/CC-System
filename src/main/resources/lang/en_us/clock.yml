clock:
  usage:
    main: '§cUsage: /clock <timer|alarm|list|cancel>'
    timer: '§cUsage: /clock timer <time(s|m|h)> <title> [forceBar]'
    alarm: '§cUsage: /clock alarm <time(HH:mm)> <title> [forceBar]'
    cancel: '§cUsage: /clock cancel <title>'
  invalid_duration_format: §cInvalid duration format. (e.g. 30s, 90m, 2h)
  duration_out_of_range: §cDuration must be 1 second or more and less than 24 hours.
  invalid_time_format: §cInvalid time format. (e.g. 07:30)
  alarm_not_future: §cPlease specify a time later than now.
  title_required: §cPlease provide a title.
  set_success: '§aClock has been set. (ID: %id%)'
  cancel_success: '§aClock has been canceled. (title: %title%)'
  cancel_not_found: '§cClock not found for the specified title. (title: %title%)'
  title_conflict: '§cA clock with the same title already exists: %title%'
  list_header: §7[§bClock List§7]
  list_empty: §eNo active clocks right now.
  list_line: §7- [%id%] %type% (%arg%) title=§f%title%§7, remaining=%remaining%, force=%force%
  type:
    timer: Timer
    alarm: Alarm
  timer:
    started: §b%duration% timer§7 "§6%title%§7" has started!
    completed: §aTimer "§6%title%§7" is complete!
  alarm:
    started: §7Alarm "§e%title%§7" has been set for §b%time%§7!
    completed: §dAlarm "§e%title%§7" is ringing now!
