gui:
  settings:
    title: 'World Settings: {world}'
    common:
      must_be_in_world: §cYou must be in this world to change this setting.
    click:
      left: Left-Click
      right: Right-Click
    info:
      display: §aWorld Info Settings
      blocks:
        summary:
        - §7Click to edit both fields in a dialog.
      action:
        open_editor: Edit world info
      dialog:
        body: You can edit the world name and description together. Leave the world name blank to keep it unchanged, and leave the description blank to clear it.
    spawn:
      display: §aSet Spawn Point
      type:
        guest: Guest
        member: Member
        both: Guest/Member Shared
      blocks:
        description:
        - §7After clicking, select a block
        - §7to set spawn location.
        - §e* Player facing direction is saved.
      action:
        set_guest: Set guest spawn
        set_member: Set member spawn
        set_both: Set shared spawn
    error:
      must_be_in_world_lore: §c *You must be in the world to change this setting
    icon:
      display: §aChange World Icon
      blocks:
        current:
        - §f§l| §7Current icon {current_icon}
        description:
        - §7Click to enter change mode.
        - §7Then, click an item in your inventory
        - §7to set it as the icon.
      action:
        start_selection: Set icon
    tags:
      display: §aWorld Tag Settings
      lore_empty: '  §fNone'
      lore_item: '  §6- {tag}'
      blocks:
        description:
        - §7Set world tags used by
        - §7Discovery search.
        summary:
        - §f§l| §7Current tags
        - '{tags_list}'
      action:
        edit: Edit tags
    expand:
      display: §aExpand World
      cost: §f§l| §7Cost §6🛖 §e{cost}
      lore_upgrade:
      - §8§m－－－－－－－－－－－－－－－－－－
      - §f§l| §7Current expansion level §e§l{current}/{max}
      - §8§m－－－－－－－－－－－－－－－－－－
      - §f§l| §7Cost §6🛖 §e{cost} §7({level_before} §f→ §e§l{level_after}§7)
      - §f§l| §7Points you own §6🛖 §e{points}
      - §8§m－－－－－－－－－－－－－－－－－－
      lore_insufficient:
      - §8§m－－－－－－－－－－－－－－－－－－
      - §f§l| §7Current expansion level §e§l{current}/{max}
      - §8§m－－－－－－－－－－－－－－－－－－
      - §f§l| §7Cost §6🛖 §c§n{cost}§r §8({level_before} → {level_after}) §c§n{shortage}Points §c are missing.
      - §f§l| §7Points you own §6🛖 §e{points}
      - §8§m－－－－－－－－－－－－－－－－－－
      lore_max:
      - §8§m－－－－－－－－－－－－－－－－－－
      - §f§l| §7Current expansion level §e§l{current}/{max}
      - §f§l| §cCannot be expanded any further!
      - §8§m－－－－－－－－－－－－－－－－－－
      lore_border_info:
      - '§f§l| §7Current border center §fX: §e{x} §7/ §fZ: §e{z}'
      - §f§l| §7Current border size §e{size}
      lore_no_border:
      - §a There are no borders in this world.
      blocks:
        description:
        - §7Expand the world border to increase
        - §7the available building area.
        status_upgrade:
        - §f§l| §7Current expansion level §e§l{current}/{max}
        - §f§l| §7Cost §6🛖 §e{cost} §7({level_before} §f→ §e§l{level_after}§7)
        - §f§l| §7Points you own §6🛖 §e{points}
        status_insufficient:
        - §f§l| §7Current expansion level §e§l{current}/{max}
        - §f§l| §7Cost §6🛖 §c§n{cost}§r §8({level_before} → {level_after}) §c§n{shortage} points missing.
        - §f§l| §7Points you own §6🛖 §e{points}
        status_max:
        - §f§l| §7Current expansion level §e§l{current}/{max}
        - §f§l| §cCannot be expanded any further!
        no_border:
        - §aThere are no borders in this world.
        border_info:
        - '§f§l| §7Current border center §fX: §e{x} §7/ §fZ: §e{z}'
        - §f§l| §7Current border size §e{size}
      action:
        open_menu: Open border expansion menu
        teleport_center: Teleport to border center surface
    environment:
      display: §a World environment settings
      blocks:
        summary:
        - §7World biome, weather, and gravity
        - §7can be changed.
      action:
        open: View
    publish:
      display: §6Change Publish Level
      current_label: Current setting
      active_prefix: '§6» '
      inactive_prefix: '  '
      blocks:
        current:
        - §f§l| §7Current setting {current_color}{current_level}
        - '{description}'
        level_list:
        - '{level_list}'
      action:
        previous: Go to previous page
        next: Go to next page
    member:
      display: §6Member Management
      role_owner: Owner
      role_moderator: Moderator
      role_member: Member
      list_item: '  {debug_color}[{role_color}{role}{debug_color}] {name_color}{player}'
      list_item_member: '  {name_color}{player}'
      more_members: '  §7+{remaining} total (§a{online} online§7)'
      blocks:
        description:
        - §7Manage players who can participate
        - §7in this world.
        summary:
        - §f§l| §7Current number of members §b{count}
        - §f§l| §7Pending requests §e{pending_request_count}
        - §f§l| §7Pending member invites §e{pending_invite_count}
        - §f§l| §bMember list
        - '{member_list}'
      action:
        open_list: View member list
    main_info:
      name: §f【§a{world}§f】
      lore:
      - §8§m-----------------------
      - §f§l| §f{description}
      - §f§l| §7Owner §b{owner}
      - §f§l| §7Expansion §e§l{level}§7/{max_level}
      - §8§m-----------------------
      - §f§l| §7Archive in §6{days_until_archive} days §8({archive_date})
      - §f§l| §7Members §f{member_count} §8({online_count} online)
      - §f§l| §7Publish Level {publish_color}{publish_level}
      - §8§m-----------------------
      - §f§l| §7Favorites §c{favorites}
      - §f§l| §7Recent Visitors §b{visitors}
      - §8§m-----------------------
      lore_special:
      - §8§m－－－－－－－－－－－－－－－－－－
      - §f§l| §f{description}
      - §f§l| §7Owner §b{owner}
      - §8§m－－－－－－－－－－－－－－－－－－
      - §f§l| §7Creation date §e{created_at_date_formatted} §8({created_days_ago})
      - '§f§l| §7 members §f{member_count} people §8(Online: {online_count} people)'
      - §f§l| §7Public level {publish_color}{publish_level}
      - §8§m－－－－－－－－－－－－－－－－－－
      - §f§l| §7Number of favorites §c{favorites}
      - §f§l| §7Recently visited players §b{visitors} people
      - §8§m－－－－－－－－－－－－－－－－－－
    visitors:
      display: §aVisitor Management
      blocks:
        summary:
        - §f§l| §7Current visitors §e{count}
      action:
        open: View list
    notification:
      display: §aToggle Notifications
      'on': 'ON'
      'off': 'OFF'
      blocks:
        current_label: Current
        description:
        - When ON, members will be notified
        - when a guest visits the world.
      action:
        toggle: Toggle
    announcement:
      display: §aPlayer Announcement
      preview_header: §f§l| §e§nCurrent Message
      blocks:
        description:
        - §7Set a message to display
        - §7to visitors upon arrival.
        preview:
        - '{message_preview}'
      action:
        set_message: Set message
        reset_message: Reset setting
        open_menu: Open action menu
    critical:
      display: §c§nCritical Settings
      blocks:
        summary:
        - §cPerform irreversible actions
        - §clike deleting the world.
      action:
        open: View
    portals:
      display: §bManage Placed Portals
      blocks:
        summary:
        - §7Manage and check portals
        - §7placed within the world.
      action:
        open: View
  user_settings:
    title: Personal settings
    cycle_action:
      next: Select next option
      previous: Select previous option
      toggle: Toggle
    notification:
      display: §aVisitor notification
      blocks:
        description:
        - When someone visits your world
        - set whether notifications are sent.
        current_label: Current state
    language:
      display: §aLanguage settings
      format: §f{language}
      blocks:
        description:
        - Change the display language of menus and messages.
        current_label: Current setting
    critical_settings_visibility:
      display: §aShow critical settings
      blocks:
        description:
        - Set whether the "Critical Settings" icon
        - is shown in the world management menu.
        current_label: Current setting
    tour_navigation:
      display: §bWorld tour navigation
      blocks:
        description:
        - Switch how world tour navigation is shown.
        - Messages are always displayed.
      mode:
        bossbar_only: Bossbar only
        all: All
        none: None
    button:
      display: §6Personal settings
      action: Open personal settings
  environment:
    title: Environment Settings
    gravity:
      display: §eGravity Settings
      current: '§f§l| §7Current Multiplier: §6{multiplier}'
      click_hint: Change by clicking while holding §e§nMoon Stone§7
      cost: '§f§l| §7Cost: §6🛖 §e{cost}'
      options:
        zero: Zero Gravity (x0.0)
        moon: Moon (x0.17)
        mars: Mars (x0.38)
        earth: Earth (x1.0)
    weather:
      display: §bWeather Settings
      current: '§f§l| §7Current Weather: §b{weather}'
      cost: '§f§l| §7Cost: §6🛖 §e{cost}'
      desc: §7The weather will be fixed to the selected setting.
      action:
        cycle: Cycle weather
        confirm: Confirm and consume points
    biome:
      display: §aBiome Settings
      current: '§f§l| §7Current Biome: §a{biome}'
      click_hint: Change by clicking while holding §e§nbiome bottle§7
      click_bottle_hint: §7Click with a Bottled Biome Air to apply.
      cost: '§f§l| §7Cost: §6🛖 §e{cost}'
      desc: §7Changes the biome for the entire world.
  member_management:
    title: Member Management
    invite:
      name: §aInvite Member
      desc: §eClick and type name in chat
      action:
        normal: Invite member
        force: Force add member
    remove_confirm:
      title: Confirm Removal
      lore:
      - §cReally remove?
      - §f§l| §7Player §f{player}
      - §f§l| §7World §f{world}
      - §c※ They will lose access to this world.
      cancel: §aCancel
      cancel_desc: §7Back to list
      confirm: §cRemove
      confirm_desc: §7Revoke membership
    item:
      last_online_label: Last Online
      online_label: §aOnline
      lore_info:
      - §8§m-----------------------
      - '{last_online}'
      - §f§l| §7Rank §f{role}
      - §8§m-----------------------
      action:
        change_role: Change role to {next_role}
        transfer_owner: Transfer ownership
        remove_member: Remove world member
    pending_item:
      name: §e{player} §7(Pending)
      status_online: §ePending §7(§aOnline§7)
      status_offline: §ePending §7(§cOffline§7)
      click: §7Open confirmation
      lore:
      - §8§m-----------------------
      - §f§l| §7Status {status}
      - §f§l| §7Sent At §f{datetime}
      - §8§m-----------------------
      - '{click}'
      - §8§m-----------------------
    pending_cancel_confirm:
      title: Cancel Invite Confirmation
      body: §cCancel the member invite to {player}?
      cancel: §aBack
      confirm: §cCancel Invite
    transfer_confirm:
      title: Transfer Ownership
      lore:
      - §cReally transfer ownership?
      - §f§l| §7New Owner §f{player}
      - §f§l| §7Target World §f{world}
      - §c※ You will lose ownership of this world.
      cancel: §aCancel
      cancel_desc: §7Back to list
      confirm: §cTransfer
      confirm_desc: §dTransfer ownership to this player
  visitor_management:
    title: Manage Visitors
    no_visitors: §cThere are currently no visitors in this world.
    kick_confirm:
      title: Confirm Kick
      question: §cReally kick?
      player: §f§l| §7Player §f{player}
      cancel: §aCancel
      cancel_desc: §7Back to list
      confirm: §cKick
      confirm_desc: §7Eject player from world
    item:
      kick: Kick
