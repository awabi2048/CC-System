      display: §eSet Template Name/ID
      description:
      - §7 Set the display name and ID of the template.
      - §fName {name}
      - ' §fID {id}'
      action: Configure
    desc_input:
      display: §eSet Template Description
      description:
      - §7 Set the template description.
      - §7Current settings
      - '{desc}'
      action: Configure
    icon_select:
      display: §eSelect Template Icon
      description:
      - §7 Set the template icon.
      - §7Current settings {icon}
      action: Configure
    origin_set:
      display: §eSet Creation Spawn
      description:
