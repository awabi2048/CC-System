    confirm_title: Batch Archive Confirmation
    question: §cArchive this world?
    warning:
    - §7Expired worlds will be archived in a batch.
    - §7This action cannot be undone.
    confirm: §cArchive
    confirm_desc: §7Archive this world
    confirm_action: Archive
    cancel: §aCancel
    cancel_desc: §7Return to previous screen
    cancel_action: Cancel
  confirm:
    reset_expansion:
      title: Confirm Reset
      display: Reset Expansion Confirmation
      question: Are you sure you want to reset?
      description:
      - §7Expansion level will be reset and points refunded.
      - §7World border will return to initial size.
      modified_warning:
      - §cChanges were recorded in expanded areas.
      - §7After reset, those changes may end up outside the border.
    spawn_adjustment_warning:
      - §eSaved spawn locations outside the border will be moved to the default location after this change.
    step_back_expansion:
      title: Confirm
      display: Expansion Step-Back Confirmation
      question: Step the world border back by one level?
      description:
      - §7The border size and center return to the previous expansion state.
      - §7Points will not be refunded.
      modified_warning:
      - §cChanges were recorded in the area being rolled back.
      - §7After rollback, that area may end up outside the border.
    reset_expansion_spawn_unsafe:
      title: Warning
      display: Spawn Point Warning
      warning: The spawn location is not safe after reset
      description:
      - §7Players outside the new border may be moved into blocks.
      - §eDo you still want to continue this reset?
      lore:
      - §cThe spawn location is not safe after reset.
      - §7Players outside the new border may be moved into blocks.
      - §eDo you still want to continue this reset?
    delete_1:
      title: Delete Confirm (1/2)
      display: World Deletion Confirmation
      question: Are you sure you want to delete this world?
      warning: All world data will be lost permanently
      next_warning: A second confirmation follows!
      next: §cProceed
    delete_2:
      title: Final Confirmation (2/2)
      display: §4§lFinal deletion confirmation
      danger: Are you positive?
      warning: Clicking will permanently delete this world!
      confirm_btn: §4§l【CONFIRM DELETE】
  critical:
    title: Critical Settings
    reset_expansion:
      display: §c§nReset Expansion
