      button:
        prev: < Prev
        next: Next >
        settings: Settings
        current_world: Current World
        return: Return
        close: Close
    world_action:
      title: 'World: {world}'
      content:
        owner: 'Owner: {owner}'
        status: 'Status: {status}'
        publish: 'Publish: {publish}'
      status:
        archived: ARCHIVED
        active: ACTIVE
      button:
        warp: Warp
        cycle_publish: Cycle Publish ({level})
        archive: Archive
        unarchive: Unarchive
        advanced_settings: Advanced Settings GUI
        back_to_worlds: Back to Worlds
        settings: Settings
        return: Return
        close: Close
    settings:
      title: User Settings [BE]
      form_content: Single-tap menu for Bedrock
      button:
        notification: 'Visitor Notification: {status}'
        language: 'Language: {language}'
        critical: 'Critical Menu: {status}'
        beta: 'Beta Features: {status}'
        back_to_worlds: Back to Worlds
        return: Return
        close: Close
    world_item:
      publish: 'Publish: {publish}'
      favorite: 'Favorite: {favorite}'
      open_actions: Tap to open actions
    input:
      info_form:
        title: Edit World Info
      rename:
        title: Rename World
        label: New World Name
        placeholder: Enter world name
      description:
        title: Change Description
        label: New Description
        placeholder: Enter description
      member_invite:
        title: Invite Member
        label: Player Name
        placeholder: Enter player name
      creation_name:
        title: Enter World Name
        label: Enter the name of the world to create
        placeholder: Type world name
      creation_seed:
        title: Enter Seed Value
        label: Enter the seed value to use for generation
