        title: Player Filter
        label: Target Player Name
        placeholder: Type player name
      template_wizard_name:
        title: Enter Template Name
        label: Template Name
        placeholder: Type template name
      template_wizard_desc:
        title: Enter Template Description
        label: Template Description
        placeholder: Type description
      announcement_menu:
        title: Announcement
        content: Choose an action
        edit: Edit
        reset: Reset
      announcement_edit:
        title: Edit Announcement ({max_lines} lines / {max_length} chars)
        label: Line {line}
        placeholder: Leave blank to skip this line
      info_selector:
        title: Select Input
        content: Choose what to edit
        rename: World Name
        description: Description
  player_world:
    title: My world list
    world_item:
      warp: Warp to this world
      settings: Open world settings
      move_to_top: Reorder
      expired: This world has been archived
      expires_at: Archive schedule
      expires_value: '{days} days (archived on {date})'
    creation_button:
      display: §a§lCreate a new My World
      action: Start world creation
      description:
      - §7 Create a new My World.
      - §7You can freely set the template and disclosure range.
    creation_unavailable:
      policy_denied:
        display: §cWorld creation is currently unavailable.
        lore:
        - §7World creation is currently unavailable.
        - §7Please wait until it becomes available again.
      no_slot:
        display: §cNo world slots are available.
        lore:
        - §7All of your My World creation slots are in use.
        - §7Delete an unused world, or use a "World Seed" to add a slot.
      no_permission:
        display: §cYou do not have permission to create worlds
        lore:
        - §7You do not have permission to create worlds.
        - §7Creation permission is required.
    stats_button:
      display: §e{player}
      points_label: World Points
      points_description: Points used to create and expand MyWorlds
      slots_label: World Slots
      world_count_label: World Count
      slots_description: Slots available for creating new MyWorlds. Use a World Seed to add more
      slots_bypass_description: You have permission to bypass the world limit
    pending_button:
      display: Invites and Requests
      description:
      - Review received invitations and requests.
      count_label: Pending
      latest_label: Latest Notification
      none: None
      empty: "§7There are no pending invitations or requests"
      action: Open list
