gui:
  meet:
    title: Visit {player}
    title_list: Go to Player's Place
    empty_message: §7No players are available to display.
    world_item:
      current_world: Current World
      same_world: Same world
      status: Status
      online_state: Connection
      online: Online
      offline: Offline
      click_visit: Warp to this world
      click_request: Send warp request
    status_button:
      display: §a{player}
      current: Current Status
      next: Next Status
      action: toggle
  member_request_confirm:
    title: Member Request Confirmation
    confirm: §aSend Request
    cancel: §cCancel
    lore:
    - §fSend a §dmember request§f to
    - §fthe owner of "§a{world}§f"?
    - §7If the owner approves, you will become a member.
  member_request_owner_confirm:
    title: Member Request Approval
    confirm: §aApprove
    reject: §cReject
    lore:
    - §fApprove the §dmember request§f from
    - §fplayer "§a{player}§f"?
    - §7If approved, they will become a member of this world.
  member_invite_accept_confirm:
    title: Member Invite Confirmation
    confirm: §aAccept
    cancel: §cDecline
    lore:
    - §fAccept the §dmember invite§f from
    - §fplayer "§a{player}§f"?
    - '§7Target world: §a{world}'
