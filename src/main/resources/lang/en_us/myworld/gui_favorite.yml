gui:
  favorite:
    title: Favorite Worlds
    empty_message: §7No favorites match the current filter.
    empty_message_no_favorites: §7No favorites yet.
    current_world:
      name: §bCurrent World
      unmanaged: §eThis world is not managed as a MyWorld.
    world_item:
      warp: Warp to this world
      preview: Preview this world
      unfavorite: Remove from favorites
      open_actions: Open world actions
      direct_warp_unavailable: §eThe current access settings do not allow a direct warp to this world.
      archived_label: §c§l[ARCHIVED]
    info:
      display: §fStatistics
    player_icon:
      name: §b{player}
      lore_count: Favorited Worlds
    favorite_menu:
      other_worlds:
        name: §aOther Worlds of this Player
        lore:
        - §7View other worlds owned by
        - §7the owner of this world.
        action: View other worlds
      toggle:
        name_add: §bAdd to Favorites
        name_remove: §cRemove from Favorites
        name_restricted: §7Cannot Favorite
        lore_add: §7Add this world to your favorites.
        lore_remove: §7Remove this world from your favorites.
        lore_restricted_owner: §cYou cannot favorite your own world.
        lore_restricted_not_managed: §cThis location cannot be favorited.
        action: Toggle favorite
    remove_confirm:
      title: Confirmation of cancellation of favorites
      lore:
      - §fWorld "§a{world}§f"
      - §cRemove from favorites§f?
      - If you cancel §7, it will be removed from your favorites list.
      confirm: §aRemove Favorite
    actions:
      title: "Actions for {world}"
      warp: §aWarp to World
      preview: §bPreview World
      invite: §eInvite Nearby Players to This World
      invite_description:
      - Invite eligible players in your current world
      - to this favorite world.
      invite_recipient_count: Eligible Players
      invite_unavailable: §cGroup invitations are unavailable for this world.
      invite_no_recipients: §eThere are no eligible players in your current world.
      unfavorite: §cRemove from Favorites
    invite_confirm:
      title: Confirm Group Invitation
      recipient_count: Players to Invite
      confirm: §aSend Invitations
